name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: install dev dependencies
        run: npm ci

      - name: typecheck
        run: npx tsc --noEmit

      - name: audit copilot absence
        run: sh scripts/audit-no-copilot.sh

      - name: test
        run: npx vitest run

      - name: artifacts match SHA256SUMS
        run: git diff --exit-code -- SHA256SUMS artifacts
